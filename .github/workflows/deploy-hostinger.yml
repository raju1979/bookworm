# Deploy BookWorm (Vue + PHP) to Hostinger on push to main.
#
# Secrets:
#   FTP_SERVER          Hostinger FTP hostname or IP (hPanel → Files → FTP Accounts)
#   FTP_USERNAME
#   FTP_PASSWORD
#   FTP_SERVER_DIR      IMPORTANT: path relative to FTP login home.
#                       If FileZilla opens in public_html already, use: bookworm/
#                       If FileZilla opens at account root, use: public_html/bookworm/
#   DB_USER / DB_PASSWORD / DB_NAME
#   FIREBASE_PROJECT_ID optional
#
# Protocol: FTPS (explicit TLS on port 21). Hostinger shared hosting supports
# FTP/FTPS — not the same as SFTP (SSH, usually port 65002).

name: Deploy Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-hostinger
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y zip lftp

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Write PHP production env
        working-directory: backend-php
        env:
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NAME: ${{ secrets.DB_NAME }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
        run: |
          set -euo pipefail
          : "${DB_USER:?Missing secret DB_USER}"
          : "${DB_PASSWORD:?Missing secret DB_PASSWORD}"
          : "${DB_NAME:?Missing secret DB_NAME}"
          PROJECT_ID="${FIREBASE_PROJECT_ID:-bookworm-6c9ec}"
          printf '%s\n' \
            "NODE_ENV=production" \
            "APP_ENV=production" \
            "DB_DIALECT=mysql" \
            "DB_HOST=localhost" \
            "DB_PORT=3306" \
            "DB_USER=${DB_USER}" \
            "DB_PASSWORD=${DB_PASSWORD}" \
            "DB_NAME=${DB_NAME}" \
            "FIREBASE_PROJECT_ID=${PROJECT_ID}" \
            "APP_BASE=/bookworm/backend" \
            "CORS_ORIGINS=https://ajarafashion.com,https://www.ajarafashion.com" \
            "ENFORCE_ORIGIN_WHITELIST=true" \
            "ORIGIN_ALLOW_EMPTY=false" \
            > .env.production

      - name: Pack web + PHP for Hostinger
        working-directory: backend-php
        run: npm run pack:web

      - name: Show pack output (debug)
        run: |
          echo "=== dist/deploy ==="
          ls -la backend-php/dist/deploy/
          echo "=== index.html ==="
          cat backend-php/dist/deploy/index.html
          test -f backend-php/dist/deploy/bookworm-logo.png
          test -f backend-php/dist/deploy/index.html

      - name: Normalize FTP remote dir
        id: ftpdir
        env:
          RAW_DIR: ${{ secrets.FTP_SERVER_DIR }}
        run: |
          set -euo pipefail
          DIR="${RAW_DIR:?Missing secret FTP_SERVER_DIR}"
          DIR="${DIR#/}"          # drop leading slash (FTP paths are usually relative)
          DIR="${DIR%/}/"         # ensure trailing slash
          echo "server_dir=$DIR" >> "$GITHUB_OUTPUT"
          echo "Using FTP remote dir: $DIR"

      # Force full overwrite with lftp (FTP-Deploy-Action was skipping / not replacing)
      - name: Deploy to Hostinger (lftp mirror)
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ steps.ftpdir.outputs.server_dir }}
        run: |
          set -euo pipefail
          : "${FTP_SERVER:?}"
          : "${FTP_USERNAME:?}"
          : "${FTP_PASSWORD:?}"
          : "${FTP_SERVER_DIR:?}"

          # Hostinger: FTPS explicit TLS on :21 (not SFTP/SSH :65002)
          lftp -c "
            set ftp:ssl-allow true;
            set ftp:ssl-force true;
            set ftp:ssl-protect-data true;
            set ssl:verify-certificate no;
            set ftp:passive-mode true;
            set net:timeout 30;
            set net:max-retries 5;
            set net:reconnect-interval-base 5;
            set mirror:parallel-transfer-count 3;
            open -u ${FTP_USERNAME},${FTP_PASSWORD} ftps://${FTP_SERVER}:21;
            pwd;
            ls;
            mirror -R --delete --verbose \
              --exclude-glob .git* \
              --exclude-glob UPLOAD.txt \
              --exclude-glob '__MACOSX/**' \
              --exclude-glob 'bookworm-hostinger.zip' \
              --exclude-glob '.ftp-deploy-sync-state.json' \
              ./backend-php/dist/deploy/ ${FTP_SERVER_DIR};
            echo '=== remote listing after mirror ===';
            ls -la ${FTP_SERVER_DIR};
            echo '=== remote index.html ===';
            cat ${FTP_SERVER_DIR}index.html || cat ${FTP_SERVER_DIR}/index.html || true;
          "
