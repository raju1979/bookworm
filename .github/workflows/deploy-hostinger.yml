# Deploy BookWorm (Vue + PHP) to Hostinger on push to main.
#
# Secrets:
#   FTP_SERVER          hostname OR IP from hPanel → Files → FTP Accounts
#                       (e.g. ftp.ajarafashion.com or 82.112.229.227)
#   FTP_USERNAME
#   FTP_PASSWORD
#   FTP_SERVER_DIR      optional parent prefix only. Remote app folder is always bookworm/
#                       leave empty / bookworm/  OR  public_html/  if login is account root
#   DB_USER / DB_PASSWORD / DB_NAME
#   FIREBASE_PROJECT_ID optional
#
# Protocol: plain FTP port 21 (same as working hello-world test).

name: Deploy Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-hostinger
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y zip lftp netcat-openbsd

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Write PHP production env
        working-directory: backend-php
        env:
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NAME: ${{ secrets.DB_NAME }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
        run: |
          set -euo pipefail
          : "${DB_USER:?Missing secret DB_USER}"
          : "${DB_PASSWORD:?Missing secret DB_PASSWORD}"
          : "${DB_NAME:?Missing secret DB_NAME}"
          PROJECT_ID="${FIREBASE_PROJECT_ID:-bookworm-6c9ec}"
          printf '%s\n' \
            "NODE_ENV=production" \
            "APP_ENV=production" \
            "DB_DIALECT=mysql" \
            "DB_HOST=localhost" \
            "DB_PORT=3306" \
            "DB_USER=${DB_USER}" \
            "DB_PASSWORD=${DB_PASSWORD}" \
            "DB_NAME=${DB_NAME}" \
            "FIREBASE_PROJECT_ID=${PROJECT_ID}" \
            "APP_BASE=/bookworm/backend" \
            "CORS_ORIGINS=https://ajarafashion.com,https://www.ajarafashion.com" \
            "ENFORCE_ORIGIN_WHITELIST=true" \
            "ORIGIN_ALLOW_EMPTY=false" \
            > .env.production

      - name: Pack web + PHP for Hostinger
        working-directory: backend-php
        run: npm run pack:web

      - name: Show pack output (debug)
        run: |
          echo "=== dist/bookworm ==="
          ls -la backend-php/dist/bookworm/
          echo "=== index.html ==="
          cat backend-php/dist/bookworm/index.html
          test -f backend-php/dist/bookworm/bookworm-logo.png
          test -f backend-php/dist/bookworm/index.html

      - name: Deploy to Hostinger (lftp mirror)
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          RAW_DIR: ${{ secrets.FTP_SERVER_DIR }}
        run: |
          set -euo pipefail

          : "${FTP_SERVER:?Missing secret FTP_SERVER}"
          : "${FTP_USERNAME:?Missing secret FTP_USERNAME}"
          : "${FTP_PASSWORD:?Missing secret FTP_PASSWORD}"

          HOST="$FTP_SERVER"
          HOST="${HOST#ftp://}"
          HOST="${HOST#ftps://}"
          HOST="${HOST%%/*}"
          HOST="${HOST%%:*}"
          HOST="${HOST#"${HOST%%[![:space:]]*}"}"
          HOST="${HOST%"${HOST##*[![:space:]]}"}"

          # Remote app folder is always bookworm/ (never "deploy")
          PREFIX="${RAW_DIR:-}"
          PREFIX="${PREFIX#/}"
          PREFIX="${PREFIX%/}"
          # Treat mistaken values as empty
          case "$PREFIX" in
            ''|bookworm|deploy|knowledge) PREFIX="" ;;
            public_html|public_html/bookworm) PREFIX="public_html" ;;
            public_html/*) PREFIX="public_html" ;;
          esac

          if [[ -n "$PREFIX" ]]; then
            DIR="${PREFIX}/bookworm/"
          else
            DIR="bookworm/"
          fi

          echo "FTP host=$HOST user=$FTP_USERNAME dir=$DIR"

          if [[ -z "$HOST" ]]; then
            echo "::error::FTP_SERVER is empty after normalizing"
            exit 1
          fi

          echo "=== TCP probe port 21 ==="
          if ! nc -z -w 10 "$HOST" 21; then
            echo "::error::Cannot reach ${HOST}:21"
            exit 1
          fi

          echo "=== FTP connect + list ==="
          CONNECT_OUT=$(lftp \
            -u "$FTP_USERNAME","$FTP_PASSWORD" \
            "ftp://${HOST}:21" \
            -e "
            set ftp:ssl-force no;
            set ftp:ssl-allow no;
            set ftp:ssl-protect-data no;
            set ftp:passive-mode yes;
            set net:timeout 30;
            set net:max-retries 2;
            pwd;
            cls -1;
            bye
          " 2>&1) || {
            echo "$CONNECT_OUT"
            echo "::error::FTP open/login failed"
            exit 1
          }
          echo "$CONNECT_OUT"

          TOP_LIST=$(printf '%s\n' "$CONNECT_OUT" | tr -d '\r')

          if printf '%s\n' "$TOP_LIST" | grep -qx 'public_html'; then
            echo "Login home is account root — using public_html/bookworm/"
            DIR="public_html/bookworm/"
          elif [[ "$DIR" == public_html/* ]]; then
            DIR="${DIR#public_html/}"
            echo "Stripped leading public_html/ → using: $DIR"
          fi

          # Final guard: never upload to a folder named deploy
          if [[ "$DIR" == *deploy* ]]; then
            DIR="bookworm/"
          fi

          echo "Mirroring to: $DIR"

          lftp \
            -u "$FTP_USERNAME","$FTP_PASSWORD" \
            "ftp://${HOST}:21" \
            -e "
            set ftp:ssl-force no;
            set ftp:ssl-allow no;
            set ftp:ssl-protect-data no;
            set ftp:passive-mode yes;
            set net:timeout 30;
            set net:max-retries 5;
            set net:reconnect-interval-base 5;
            set mirror:parallel-transfer-count 3;
            mkdir -p ${DIR};
            mirror -R --delete --verbose \
              --exclude-glob .git* \
              --exclude-glob UPLOAD.txt \
              --exclude-glob '__MACOSX/**' \
              --exclude-glob 'bookworm-hostinger.zip' \
              --exclude-glob '.ftp-deploy-sync-state.json' \
              --exclude-glob hello-world.txt \
              ./backend-php/dist/bookworm/ ${DIR};
            echo '=== remote listing after mirror ===';
            ls -la ${DIR};
            echo '=== remote index.html ===';
            cat ${DIR}index.html;
            bye
          "

          echo "OK — deployed to ${DIR}"
