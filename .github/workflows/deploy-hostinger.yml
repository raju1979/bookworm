# Temporary: FTP smoke deploy only (no frontend/PHP build).
# Uploads hello-world.txt to FTP_SERVER_DIR on push to main.
#
# Secrets: FTP_SERVER, FTP_USERNAME, FTP_PASSWORD, FTP_SERVER_DIR
# Example FTP_SERVER_DIR: knowledge/  (or bookworm/ once verified)

name: Deploy Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-hostinger
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Install lftp
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Create hello-world.txt
        run: |
          mkdir -p /tmp/ftp-hello
          printf 'hello world from GitHub Actions\nuploaded_at=%s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            > /tmp/ftp-hello/hello-world.txt
          cat /tmp/ftp-hello/hello-world.txt

      - name: Normalize FTP remote dir
        id: ftpdir
        env:
          RAW_DIR: ${{ secrets.FTP_SERVER_DIR }}
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -euo pipefail
          DIR="${RAW_DIR:?Missing secret FTP_SERVER_DIR}"
          DIR="${DIR#/}"
          DIR="${DIR%/}/"

          : "${FTP_SERVER:?}"
          : "${FTP_USERNAME:?}"
          : "${FTP_PASSWORD:?}"

          TOP_LIST=$(lftp -c "
            set ftp:ssl-allow false;
            set ftp:passive-mode true;
            set net:timeout 30;
            open -u ${FTP_USERNAME},${FTP_PASSWORD} ftp://${FTP_SERVER}:21;
            pwd;
            echo '=== top-level listing ===';
            cls -1;
          " | tr -d '\r' || true)

          echo "$TOP_LIST"

          if printf '%s\n' "$TOP_LIST" | grep -qx 'public_html'; then
            echo "Login home is account root (sees public_html/)"
          else
            if [[ "$DIR" == public_html/* ]]; then
              DIR="${DIR#public_html/}"
              echo "Stripped leading public_html/ → FTP home is already public_html"
            fi
          fi

          echo "server_dir=$DIR" >> "$GITHUB_OUTPUT"
          echo "Using FTP remote dir: $DIR"

      - name: Upload hello-world.txt
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ steps.ftpdir.outputs.server_dir }}
        run: |
          set -euo pipefail
          : "${FTP_SERVER:?}"
          : "${FTP_USERNAME:?}"
          : "${FTP_PASSWORD:?}"
          : "${FTP_SERVER_DIR:?}"

          lftp -c "
            set ftp:ssl-allow false;
            set ftp:passive-mode true;
            set net:timeout 30;
            set net:max-retries 3;
            open -u ${FTP_USERNAME},${FTP_PASSWORD} ftp://${FTP_SERVER}:21;
            mkdir -p ${FTP_SERVER_DIR};
            cd ${FTP_SERVER_DIR};
            pwd;
            put /tmp/ftp-hello/hello-world.txt -o hello-world.txt;
            ls -la;
            echo '=== hello-world.txt on server ===';
            cat hello-world.txt;
          "

          echo "OK — ${FTP_SERVER_DIR}hello-world.txt"
