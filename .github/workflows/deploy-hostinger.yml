# Temporary: FTP smoke deploy only (no frontend/PHP build).
# Uploads hello-world.txt to FTP_SERVER_DIR on push to main.
#
# Secrets:
#   FTP_SERVER       hostname OR IP only — e.g. ftp.ajarafashion.com or 82.112.229.227
#                    NOT ftp://..., NOT a path, NOT the username
#   FTP_USERNAME     from hPanel → Files → FTP Accounts
#   FTP_PASSWORD
#   FTP_SERVER_DIR   e.g. knowledge/

name: Deploy Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-hostinger
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y lftp netcat-openbsd dnsutils

      - name: Create hello-world.txt
        run: |
          mkdir -p /tmp/ftp-hello
          printf 'hello world from GitHub Actions\nuploaded_at=%s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            > /tmp/ftp-hello/hello-world.txt
          cat /tmp/ftp-hello/hello-world.txt

      - name: Upload hello-world.txt via FTP
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR }}
        run: |
          set -euo pipefail

          : "${FTP_SERVER:?Missing secret FTP_SERVER}"
          : "${FTP_USERNAME:?Missing secret FTP_USERNAME}"
          : "${FTP_PASSWORD:?Missing secret FTP_PASSWORD}"
          : "${FTP_SERVER_DIR:?Missing secret FTP_SERVER_DIR}"

          # Normalize host: users often paste ftp://host:21/ or host/path
          HOST="$FTP_SERVER"
          HOST="${HOST#ftp://}"
          HOST="${HOST#ftps://}"
          HOST="${HOST%%/*}"          # drop path
          HOST="${HOST%%:*}"          # drop :port if present
          HOST="${HOST#"${HOST%%[![:space:]]*}"}"
          HOST="${HOST%"${HOST##*[![:space:]]}"}"

          DIR="${FTP_SERVER_DIR#/}"
          DIR="${DIR%/}/"

          echo "FTP_SERVER raw length=${#FTP_SERVER}"
          echo "FTP_SERVER normalized=$HOST"
          echo "FTP_USERNAME=$FTP_USERNAME"
          echo "FTP_PASSWORD length=${#FTP_PASSWORD}"
          echo "FTP_SERVER_DIR=$DIR"

          if [[ -z "$HOST" ]]; then
            echo "::error::FTP_SERVER is empty after normalizing"
            exit 1
          fi

          if [[ "$HOST" == *"@"* ]] || [[ "$HOST" == *" "* ]]; then
            echo "::error::FTP_SERVER looks invalid. Use only hostname or IP (no user@, no spaces)."
            exit 1
          fi

          echo "=== Host validation ==="
          if [[ "$HOST" =~ ^([0-9]{1,3}\.){3}[0-9]{1,3}$ ]]; then
            # A numeric IP does not need a reverse-DNS (PTR) record. The previous
            # `host` check incorrectly rejected valid IPs when reverse DNS returned
            # NXDOMAIN. The TCP probe below is the authoritative connectivity test.
            echo "Numeric IPv4 address supplied; skipping reverse-DNS lookup"
          elif getent ahostsv4 "$HOST" >/dev/null 2>&1; then
            echo "DNS OK"
          else
            echo "::error::DNS cannot resolve the FTP hostname"
            echo "Fix FTP_SERVER to the hostname or IP from hPanel → Files → FTP Accounts."
            exit 1
          fi

          echo "=== TCP probe port 21 ==="
          if nc -z -w 10 "$HOST" 21; then
            echo "Port 21 is open"
          else
            echo "::error::Cannot reach ${HOST}:21 from GitHub Actions"
            echo "In hPanel: enable FTP; disable IP restrictions for this FTP account."
            exit 1
          fi

          echo "=== FTP connect + list ==="
          CONNECT_OUT=$(lftp \
            -u "$FTP_USERNAME","$FTP_PASSWORD" \
            "ftp://${HOST}:21" \
            -e "
            set ftp:ssl-force no;
            set ftp:ssl-allow no;
            set ftp:ssl-protect-data no;
            set ftp:passive-mode yes;
            set net:timeout 30;
            set net:max-retries 2;
            pwd;
            cls -1;
            bye
          " 2>&1) || {
            echo "$CONNECT_OUT"
            echo "::error::FTP open/login failed for host=$HOST user=$FTP_USERNAME"
            exit 1
          }
          echo "$CONNECT_OUT"

          TOP_LIST=$(printf '%s\n' "$CONNECT_OUT" | tr -d '\r')

          if printf '%s\n' "$TOP_LIST" | grep -qx 'public_html'; then
            echo "Login home is account root (sees public_html/)"
          elif [[ "$DIR" == public_html/* ]]; then
            DIR="${DIR#public_html/}"
            echo "Stripped leading public_html/ → using: $DIR"
          fi

          echo "Final upload dir: $DIR"

          lftp \
            -u "$FTP_USERNAME","$FTP_PASSWORD" \
            "ftp://${HOST}:21" \
            -e "
            set ftp:ssl-force no;
            set ftp:ssl-allow no;
            set ftp:ssl-protect-data no;
            set ftp:passive-mode yes;
            set net:timeout 30;
            set net:max-retries 3;
            mkdir -p ${DIR};
            cd ${DIR};
            pwd;
            put /tmp/ftp-hello/hello-world.txt -o hello-world.txt;
            ls -la;
            echo '=== hello-world.txt on server ===';
            cat hello-world.txt;
            bye
          "

          echo "OK — ${DIR}hello-world.txt"
