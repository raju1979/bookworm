# Temporary: FTP smoke deploy only (no frontend/PHP build).
# Uploads hello-world.txt to FTP_SERVER_DIR on push to main.
#
# Secrets: FTP_SERVER, FTP_USERNAME, FTP_PASSWORD, FTP_SERVER_DIR
# FTP_SERVER = host from hPanel → Files → FTP Accounts (hostname preferred over IP)
# FTP_SERVER_DIR = knowledge/  (relative to FTP login home; no leading slash)

name: Deploy Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-hostinger
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y lftp netcat-openbsd

      - name: Create hello-world.txt
        run: |
          mkdir -p /tmp/ftp-hello
          printf 'hello world from GitHub Actions\nuploaded_at=%s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            > /tmp/ftp-hello/hello-world.txt
          cat /tmp/ftp-hello/hello-world.txt

      - name: Upload hello-world.txt via FTP
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          RAW_DIR: ${{ secrets.FTP_SERVER_DIR }}
        run: |
          set -euo pipefail

          : "${FTP_SERVER:?Missing secret FTP_SERVER}"
          : "${FTP_USERNAME:?Missing secret FTP_USERNAME}"
          : "${FTP_PASSWORD:?Missing secret FTP_PASSWORD}"
          : "${RAW_DIR:?Missing secret FTP_SERVER_DIR}"

          DIR="${RAW_DIR#/}"
          DIR="${DIR%/}/"

          echo "FTP_SERVER=$FTP_SERVER"
          echo "FTP_USERNAME=$FTP_USERNAME"
          echo "FTP_PASSWORD length=${#FTP_PASSWORD}"
          echo "FTP_SERVER_DIR=$DIR"

          echo "=== TCP probe port 21 ==="
          if nc -z -w 10 "$FTP_SERVER" 21; then
            echo "Port 21 is open"
          else
            echo "::error::Cannot reach ${FTP_SERVER}:21 from GitHub Actions"
            echo "In hPanel: enable FTP, and disable IP restrictions (or allow all) for this FTP account."
            exit 1
          fi

          # Password via env so special chars (@ # $ ! etc.) do not break lftp -u user,pass
          export LFTP_PASSWORD="$FTP_PASSWORD"

          echo "=== FTP connect + list ==="
          CONNECT_OUT=$(lftp -c "
            set ftp:ssl-allow false;
            set ftp:passive-mode true;
            set net:timeout 30;
            set net:max-retries 2;
            open -u ${FTP_USERNAME} ftp://${FTP_SERVER}:21;
            pwd;
            cls -1;
            bye
          " 2>&1) || {
            echo "$CONNECT_OUT"
            echo "::error::FTP open/login failed."
            echo "Use the exact host/user/pass from hPanel → Files → FTP Accounts (same as FileZilla plain FTP)."
            echo "If FileZilla works from your PC but this fails: Hostinger IP restriction is blocking GitHub."
            exit 1
          }
          echo "$CONNECT_OUT"

          TOP_LIST=$(printf '%s\n' "$CONNECT_OUT" | tr -d '\r')

          if printf '%s\n' "$TOP_LIST" | grep -qx 'public_html'; then
            echo "Login home is account root (sees public_html/)"
          elif [[ "$DIR" == public_html/* ]]; then
            DIR="${DIR#public_html/}"
            echo "Stripped leading public_html/ → using: $DIR"
          fi

          echo "Final upload dir: $DIR"

          lftp -c "
            set ftp:ssl-allow false;
            set ftp:passive-mode true;
            set net:timeout 30;
            set net:max-retries 3;
            open -u ${FTP_USERNAME} ftp://${FTP_SERVER}:21;
            mkdir -p ${DIR};
            cd ${DIR};
            pwd;
            put /tmp/ftp-hello/hello-world.txt -o hello-world.txt;
            ls -la;
            echo '=== hello-world.txt on server ===';
            cat hello-world.txt;
            bye
          "

          echo "OK — ${DIR}hello-world.txt"
