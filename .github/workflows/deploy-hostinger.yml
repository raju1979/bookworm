# Deploy BookWorm (Vue + PHP) to Hostinger on push to main.
#
# Your FileZilla test shows FTP works at IP 82.112.229.227:21 (plain FTP, no TLS).
# GitHub previously timed out because FTP_SERVER pointed at the wrong host/IPs.
#
# Secrets:
#   FTP_SERVER          Use 82.112.229.227  (or the exact host from hPanel FTP Accounts)
#   FTP_USERNAME        u409673832...
#   FTP_PASSWORD
#   FTP_SERVER_DIR      /public_html/bookworm/   (trailing slash recommended)
#   DB_USER / DB_PASSWORD / DB_NAME
#   FIREBASE_PROJECT_ID optional
#
# FileZilla local tip: for a secure client use Protocol=SFTP, Port=65002.
# This workflow uses plain FTP to match what your server accepts on :21.

name: Deploy Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-hostinger
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install zip
        run: sudo apt-get update && sudo apt-get install -y zip

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Write PHP production env
        working-directory: backend-php
        env:
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NAME: ${{ secrets.DB_NAME }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
        run: |
          set -euo pipefail
          : "${DB_USER:?Missing secret DB_USER}"
          : "${DB_PASSWORD:?Missing secret DB_PASSWORD}"
          : "${DB_NAME:?Missing secret DB_NAME}"
          PROJECT_ID="${FIREBASE_PROJECT_ID:-bookworm-6c9ec}"
          printf '%s\n' \
            "NODE_ENV=production" \
            "APP_ENV=production" \
            "DB_DIALECT=mysql" \
            "DB_HOST=localhost" \
            "DB_PORT=3306" \
            "DB_USER=${DB_USER}" \
            "DB_PASSWORD=${DB_PASSWORD}" \
            "DB_NAME=${DB_NAME}" \
            "FIREBASE_PROJECT_ID=${PROJECT_ID}" \
            "APP_BASE=/bookworm/backend" \
            "CORS_ORIGINS=https://ajarafashion.com,https://www.ajarafashion.com" \
            "ENFORCE_ORIGIN_WHITELIST=true" \
            "ORIGIN_ALLOW_EMPTY=false" \
            > .env.production

      - name: Pack web + PHP for Hostinger
        working-directory: backend-php
        run: npm run pack:web

      - name: Normalize FTP remote dir
        id: ftpdir
        env:
          RAW_DIR: ${{ secrets.FTP_SERVER_DIR }}
        run: |
          set -euo pipefail
          DIR="${RAW_DIR:?Missing secret FTP_SERVER_DIR}"
          DIR="${DIR%/}/"
          echo "server_dir=$DIR" >> "$GITHUB_OUTPUT"
          echo "Using server-dir: $DIR"

      - name: Deploy to Hostinger (FTP)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: 21
          local-dir: ./backend-php/dist/deploy/
          server-dir: ${{ steps.ftpdir.outputs.server_dir }}
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/UPLOAD.txt

      # Fallback if FTP is blocked from GitHub: comment the step above and uncomment this.
      # Hostinger shared SFTP is usually port 65002.
      # - name: Deploy to Hostinger (SFTP fallback)
      #   uses: wlixcc/SFTP-Deploy-Action@v1.2.4
      #   with:
      #     server: ${{ secrets.FTP_SERVER }}
      #     username: ${{ secrets.FTP_USERNAME }}
      #     password: ${{ secrets.FTP_PASSWORD }}
      #     port: '65002'
      #     local_path: './backend-php/dist/deploy/*'
      #     remote_path: ${{ secrets.FTP_SERVER_DIR }}
      #     sftpArgs: '-o StrictHostKeyChecking=no'
