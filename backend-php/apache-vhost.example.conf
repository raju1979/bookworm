# Example Apache vhost for local testing (macOS httpd / MAMP / XAMPP).
# Point DocumentRoot at backend-php/public — Nest backend is untouched.

# <VirtualHost *:3080>
#   ServerName bookworm-api.local
#   DocumentRoot "/Volumes/outside/projects/angular-firebase-book-app/backend-php/public"
#
#   <Directory "/Volumes/outside/projects/angular-firebase-book-app/backend-php/public">
#     AllowOverride All
#     Require all granted
#   </Directory>
#
#   # Preserve Bearer tokens
#   SetEnvIf Authorization "(.*)" HTTP_AUTHORIZATION=$1
# </VirtualHost>

# Hostinger shared hosting:
# 1. Upload contents of backend-php/ (or at least public/, app/, lib/, .env, tmp/)
# 2. Set domain/subdomain document root to the `public` folder
#    OR upload public/* to public_html and place app/ + lib/ one level above
# 3. Ensure .htaccess is allowed (usually yes)
# 4. Set VITE_API_URL=https://your-domain.com  (or https://your-domain.com/api if under /api)
